apis:
- aid: koko:keywords
  name: Koko Keywords API
  description: >-
    The keyword-matching service behind Koko's Suicide Prevention Toolkit. Callers match a search term
    or post against Koko's risk taxonomy, filtered across three dimensions — category, confidence and
    intensity. Requires HTTP Basic credentials issued by Koko. Consumed through the native Rust client
    and its Python, Ruby, Go and PHP bindings, which cache the compiled regex set for sub-microsecond
    matching.
  humanURL: https://developers.kokocares.org/docs/getting-started
