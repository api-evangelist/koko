aid: koko
name: Koko
description: >-
  Koko is a 501(c)(3) nonprofit that makes free, evidence-based mental health support
  available to young people where they already are — inside the online platforms they
  use. Koko says it has reached more than 6 million users across 199 countries. Its
  model is detection plus direction: a keyword and AI engine identifies high-risk
  posts and searches on partner platforms, and matched users are routed to free crisis
  helplines and self-guided mini-courses covering mood regulation, body image and
  self-harm. Koko ships this as a developer-facing Suicide Prevention Toolkit built on
  two APIs — the credential-gated Koko Keywords API, wrapped by a native Rust client
  with Python, Ruby, Go and PHP bindings, and the public Crisis Helplines API, which
  returns crisis helpline contact data by country. Koko has been deployed by TikTok,
  Pinterest, Giphy, Snapchat, Tumblr, Bluesky, WhatsApp and Discord, and its work is
  backed by eight peer-reviewed publications including three randomized controlled
  trials.
