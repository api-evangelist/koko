  json: {field: error, type: string, description: Human-readable error message}
  text: >-
    The 403 CORS rejection is returned as text/plain, not JSON — clients must not
    assume a JSON body on every error.
notes: >-
  Koko does not publish RFC 9457 problem+json. The Crisis Helplines API uses a flat
  `{"error": "..."}` JSON object for 4xx validation errors and a bare text/plain
  string for CORS rejections. Keywords API errors are surfaced by the client library
  rather than as a documented HTTP error catalog.
