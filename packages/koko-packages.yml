notes: >-
  Koko ships one client library — the Koko Keywords client — as a native Rust core
  cross-compiled to four CPU targets, with language bindings. Python and Ruby are
  published to public registries; Go and PHP are distributed as source from GitHub
  only (no pkg.go.dev module page, no Packagist entry — both probed 404 on
  2026-07-19). No client library exists for the Crisis Helplines API; it is a
  plain unauthenticated JSON API.
